[project]
name = "todoapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "django>=6.1.1",
    "django-autocomplete-light[gfk,nested,tags]>=5.0.0",
    "django-cleanup>=9.0.0",
    "faker>=40.40.0",
    "nh3>=0.3.7",
    "python-dotenv>=1.2.3",
]

[project.scripts]
todoapp = "todoapp:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
