<tr id="data-{{ data.id }}" class="hover:bg-base-300 text-sm sm:text-base">
    <td class="text-center">{{ forloop.counter0|add:page_obj.start_index }}</td>
    <td>{{ data.kontrak.client.nama }}</td>
    <td>{{ data.teaching.get_day_of_week_display }}</td>
    <td>{{ data.tanggal_pelaksanaan }}</td>
    <td>{{ data.materi }}</td>
    <td>{{ data.is_rescheduled }}</td>

    <td class="text-center">
        <!-- Buttons for large screens -->
        <div class="hidden sm:flex justify-center gap-2">
            <form 
                method="POST"
                hx-delete="{% url 'todo_app:teaching_record_delete' data.id %}"
                hx-target="#tbody"
                hx-swap="innerHTML"
                hx-confirm="Do you want to delete this schedule?"
            >
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline btn-error">Delete</button>
            </form>
        </div>

        <!-- Three dots menu for small screens -->
        <div class="relative inline-block sm:hidden">
            <details class="dropdown dropdown-end">
                <summary class="btn btn-sm btn-ghost text-xs">⋮</summary>
                <ul class="p-2 shadow menu dropdown-content bg-base-100 rounded-box w-32 z-50 text-xs">
                    <li>
                        <form 
                            method="POST"
                            hx-delete="{% url 'todo_app:teaching_record_delete' data.id %}"
                            hx-target="#tbody"
                            hx-swap="innerHTML"
                            hx-confirm="Do you want to delete this schedule?"
                        >
                            {% csrf_token %}
                            <button type="submit" class="text-xs text-red-500 w-full text-left px-2 py-1">Delete</button>
                        </form>
                    </li>
                </ul>
            </details>
        </div>
    </td>
</tr>
