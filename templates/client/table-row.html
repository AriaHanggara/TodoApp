<tr id="client-{{ client.id }}" class="hover:bg-base-300 text-sm sm:text-base">
    <td class="text-center">{{ forloop.counter0|add:page_obj.start_index }}</td>
    <td>{{ client.nama }}</td>
    <td>{{ client.kontak }}</td>
    <td>{{ client.alamat }}</td>

    <td class="text-center">
        <!-- Buttons for large screens -->
        <div class="hidden sm:flex justify-center gap-2">
            <a 
                class="btn btn-sm btn-outline btn-info"
                hx-get="{% url 'todo_app:client_edit' client.id %}" 
                hx-target="#dialog-container" 
                hx-swap="innerHTML"
            >
                Edit
            </a>

            <form 
                method="POST"
                hx-delete="{% url 'todo_app:client_delete' client.id %}"
                hx-target="#tbody"
                hx-swap="innerHTML"
                hx-trigger='confirmed'
                onsubmit="
                    event.preventDefault();
                    Swal.fire({
                    title: 'Confirm Deletion',
                    text: 'Apakah anda yakin akan menghapus data ini?',
                    icon: 'warning',
                    showCancelButton: true
                    }).then((result) => {
                    if (result.isConfirmed) {
                        htmx.trigger(this, 'confirmed');
                    }
                    });
                "
            >
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline btn-error">Delete</button>
            </form>
        </div>

        <!-- Three dots menu for small screens -->
        <div class="relative inline-block sm:hidden">
            <details class="dropdown dropdown-end">
                <summary class="btn btn-sm btn-ghost text-xs">⋮</summary>
                <ul class="p-2 shadow menu dropdown-content bg-base-100 rounded-box w-32 z-50 text-xs">
                    <li>
                        <a 
                            class="text-xs"
                            hx-get="{% url 'todo_app:client_edit' client.id %}" 
                            hx-target="#dialog-container" 
                            hx-swap="innerHTML"
                        >
                            Edit
                        </a>
                    </li>
                    <li>
                        <form 
                            method="POST"
                            hx-delete="{% url 'todo_app:client_delete' client.id %}"
                            hx-target="#tbody"
                            hx-swap="innerHTML"
                            hx-trigger='confirmed'
                            onsubmit="
                                event.preventDefault();
                                Swal.fire({
                                title: 'Confirm Deletion',
                                text: 'Apakah anda yakin akan menghapus data ini?',
                                icon: 'warning',
                                showCancelButton: true
                                }).then((result) => {
                                if (result.isConfirmed) {
                                    htmx.trigger(this, 'confirmed');
                                }
                                });
                            "
                        >
                            {% csrf_token %}
                            <button type="submit" class="text-xs text-red-500 w-full text-left px-2 py-1">Delete</button>
                        </form>
                    </li>
                </ul>
            </details>
        </div>
    </td>
</tr>
