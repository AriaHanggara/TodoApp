<tr id="contract-{{ contract.id }}" class="hover:bg-base-300 text-sm sm:text-base">
    <td class="text-center">{{ forloop.counter0|add:page_obj.start_index }}</td>
    <td>{{ contract.client.nama }}</td>
    <td>{{ contract.total_pertemuan }}</td>
    <td>{{ contract.get_pembayaran_display }}</td>
    <td>{{ contract.get_contract_status_display }}</td>
    <td>{{ contract.total_biaya }}</td>

    <td class="text-center">
        <!-- Buttons for large screens -->
        <div class="hidden sm:flex justify-center gap-2">
            <a 
                class="btn btn-sm btn-outline btn-info"
                hx-get="{% url 'todo_app:contract_edit' contract.id %}" 
                hx-target="#dialog-container" 
                hx-swap="innerHTML"
            >
                Edit
            </a>

            <form 
                method="POST"
                hx-delete="{% url 'todo_app:contract_delete' contract.id %}"
                hx-target="#tbody"
                hx-swap="innerHTML"
                hx-confirm="Do you want to delete this contract?"
            >
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline btn-error">Delete</button>
            </form>
        </div>

        <!-- Three dots menu for small screens -->
        <div class="relative inline-block sm:hidden">
            <details class="dropdown dropdown-end">
                <summary class="btn btn-sm btn-ghost text-xs">⋮</summary>
                <ul class="p-2 shadow menu dropdown-content bg-base-100 rounded-box w-32 z-50 text-xs">
                    <li>
                        <a 
                            class="text-xs"
                            hx-get="{% url 'todo_app:contract_edit' contract.id %}" 
                            hx-target="#dialog-container" 
                            hx-swap="innerHTML"
                        >
                            Edit
                        </a>
                    </li>
                    <li>
                        <form 
                            method="POST"
                            hx-delete="{% url 'todo_app:contract_delete' contract.id %}"
                            hx-target="#tbody"
                            hx-swap="innerHTML"
                            hx-confirm="Do you want to delete this contract?"
                        >
                            {% csrf_token %}
                            <button type="submit" class="text-xs text-red-500 w-full text-left px-2 py-1">Delete</button>
                        </form>
                    </li>
                </ul>
            </details>
        </div>
    </td>
</tr>
